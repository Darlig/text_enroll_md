  #num_worker: 18
  #sph_config: !include /work105/weiyang/project/kws/text_enroll_kws/config/base_config/self_corrupt_musan_nonspeech_reverb_perturb_keyword_init_final.yaml
  sph_config: !include config/base_config/musan_nonspeech_kaldi_lex2_tone_aishell2_cut_reverb_perturb_keyword_init_final_spec0.8.yaml
  #sph_config: !include /work104/weiyang/project/maolidan_thesis/experiment/text_enroll_md/config/base_config/musan_nonspeech_kaldi_lex2_tone_aishell2_cut_reverb_perturb_keyword_init_final_spec0.8.yaml
  #sph_config: !include /work104/weiyang/project/maolidan_thesis/experiment/text_enroll_md/config/base_config/self_corrupt_musan_nonspeech_kaldi_lex_500h_ke_drama_sinvxx_1-3s_reverb_perturb_keyword_init_final_spec0.8.yaml
  keyword_config:
    format: sample
    config:
      positive_prob: 0.01
      target_level: [phone]
      #target_level: [phone, word]
      special_token:
        #sok: 1
        #eok: 2
        unk: 5423
        sop: 1
        psok: 2
        #peok: 2
        punk: 217
        with_trans: False
        #with_trans: True
      sample_func_choice:
        choices:
          - name: sample_kw_from_label
            prob: 0.0
            params:
              min_keyword_len: 2
              max_keyword_len: 5
          - name: sample_kw_using_whole_label
            prob: 1.0
            params:
              min_keyword_len: 2
              max_keyword_len: 5
      neg_sample_func_choice:
        choices:
          - name: substitution_neg_by_lex
            prob: 0.0
            params: {}
          - name: substitution_neg_by_lex_shengyun_constraint
            prob: 0.0
            params:
              p_change: 0.5
              type_weights:
                init: 0.4
                final: 0.4
                both: 0.2
          - name: substitution_neg_by_lex_shengyun_constraint_tone
            prob: 1.0
            params:
              p_change: 0.8
              type_weights:
                init: 0.1
                final: 0.1
                both: 0.1
                tone: 0.7
          - name: substitution_neg_md
            prob: 0.0
            params:
              max_sub_ratio: 0.5
              min_sub: 1
      aux_lexicon: resource/500h_with_wenet_drama_sinvxx_1-3s/version_kaldi_ipa/forced_alignment_cut/data_process/lexicon_aishell2_clean_sort2_split8_cut_alt_tone.json
  length_key: speech,keyword
  fetch_key: speech,speech_len,phn_label,phn_label_len,keyword,keyword_len,target
