# model archive
model_arch: TransformerKWSPhone_hubert_wenet

# model config
model_config:
  audio_net_config:
    input_trans: &linear_common
      dim: [256, 256]
      num_block: 1
      norm: LayerNorm
      act: ReLU
    transformer_config: 
      size: 256
      self_att: MultiHeadAtt
      self_att_config: &att_common
        n_head: 4
        n_feats: 256
      cross_att: MultiHeadCrossAtt
      corss_att_config: 
        n_head: 1
        n_feats: 256
        norm: LayerNorm
      feed_forward_config: &feed_forward_common
        dim: [256, 512, 256]
        num_block: 1
        norm: LayerNorm
        act: ReLU
      conv_config:
        channels: 256

  kw_net_config:
    #num_token: 31 # letter 1-26 special token ' and tow keyword pos_token 28, 29, 30 for unknown
    num_phn_token: 218
    input_trans: 
      dim: 256
      num_block: 1
      norm: LayerNorm
      act: ReLU
    transformer_config:
      size: 256
      self_att: MultiHeadAtt
      self_att_config: *att_common
      feed_forward_config: *feed_forward_common
  au_kw_net_config:
    #num_token: 31 # letter 1-26 special token ' and tow keyword pos_token 28, 29, 30 for unknown
    #num_phn_token: 176
    input_trans: 
      dim: 256
      num_block: 1
      norm: LayerNorm
      act: ReLU
    transformer_config:
      size: 256
      self_att: MultiHeadAtt
      self_att_config: *att_common
      feed_forward_config: *feed_forward_common
  num_audio_self_block: 4
  num_kw_self_block: 4
  num_au_kw_concat_block: 4
  sok: 1
  eok: 2
  #loss_weight: [0.3, 0.1, 0.3]

# experimental config
exp_config:
  exp_dir: exp/hubert_wenet_aishell2_data_aug
  #exp_dir: exp/aishell2_cut_gt400_kaldi_lex2_tone_whole_utt_neg_by_lex_pos0.01_change0.8_w0.1_0.1_0.1_0.7_spec_mask_w_psok_hanlp_md_transformer_4sph_4kw_4concat_ctc_det_reverb_perturb_nomix_keyword_init_final_seg_pos_spec0.8
  #exp_dir: exp/500h_hanlp_transformer_4sph_4kw_4cross_reverb_perturb_keyword_init_final
  warm_up_peak_epoch: 5
  exp_name: kwatt_asr
  optim_config:
    lr: 0.0001
    #lr: 0.001
  log_config:
    level: "INFO"
    filemode: "a"
    format:  "%(asctime)s: %(message)s"
  log_interval: 5
  valid_interval: 100

# data config
data_config: &base_data_config
  #epoch: 151
  #epoch: 101
  #epoch: 100
  #epoch: 1
  epoch: 51
  #epoch: 6
  #epoch: 26
  #epoch: 25
